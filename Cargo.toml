[package]
name = "constellation"
version = "0.1.0"
edition = "2024"

[dependencies]
constellation-code = { git = "https://github.com/IPNetworkingLab/constellation-code.git", version = "0.1.0"}

clap = { version = "4.6.1", features = ["derive"] }
satkit = { version = "0.18.0", features = ["download"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tqdm = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
yaml_serde = "0.10.4"
